<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌦️ 台灣各縣市即時氣象地圖 Taiwan Weather Map</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <!-- Leaflet CSS & JS via jsdelivr (Fast and rock-solid) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root {
            --bg-dark: #080d1a;
            --panel-bg: rgba(15, 23, 42, 0.88);
            --panel-border: rgba(255, 255, 255, 0.12);
            --primary: #38bdf8;
            --primary-hover: #0284c7;
            --accent-max: #ef4444;
            --accent-min: #38bdf8;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --gold: #fbbf24;
            --green: #22c55e;
            --cyan: #06b6d4;
            --indigo: #818cf8;
            --typhoon: #f43f5e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans TC', 'Outfit', sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-dark);
            color: var(--text-main);
        }

        /* 1. Fullscreen Map Background */
        #map {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            background: #0b1120;
        }

        /* 2. Top-Left Floating Header with Timestamp */
        .floating-header {
            position: fixed;
            top: 14px;
            left: 14px;
            z-index: 1000;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 12px;
            padding: 8px 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .floating-header h1 {
            font-size: 1.02rem;
            font-weight: 800;
            background: linear-gradient(90deg, #38bdf8, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .timestamp-tag {
            background: rgba(56, 189, 248, 0.12);
            color: #7dd3fc;
            border: 1px solid rgba(56, 189, 248, 0.3);
            font-size: 0.68rem;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 4px;
            font-family: 'Outfit', sans-serif;
        }

        .timestamp-tag::before {
            content: "";
            width: 6px;
            height: 6px;
            background-color: #22c55e;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 6px #22c55e;
        }

        /* 3. Top-Center Floating Mode Switcher */
        .floating-mode-bar {
            position: fixed;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 30px;
            padding: 4px 6px;
            display: flex;
            align-items: center;
            gap: 4px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 90vw;
            overflow-x: auto;
        }

        .mode-btn {
            background: transparent;
            border: 1px solid transparent;
            color: #94a3b8;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .mode-btn:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.08);
        }

        .mode-btn.active {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: #ffffff;
            border-color: rgba(56, 189, 248, 0.5);
            box-shadow: 0 2px 10px rgba(2, 132, 199, 0.45);
        }

        /* Toggle Button Special Styling */
        .mode-btn.toggle-active {
            background: rgba(244, 63, 94, 0.2);
            color: #fb7185;
            border-color: rgba(244, 63, 94, 0.5);
        }

        .mode-btn.toggle-active.stations {
            background: rgba(56, 189, 248, 0.2);
            color: #38bdf8;
            border-color: rgba(56, 189, 248, 0.5);
        }

        /* 4. Top-Right Floating Control Panel (Basemaps & Tools) */
        .floating-control-panel {
            position: fixed;
            top: 14px;
            right: 14px;
            z-index: 1000;
            width: 195px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 12px;
            padding: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .panel-section-title {
            font-size: 0.68rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--text-sub);
            margin-bottom: 2px;
        }

        .basemap-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
        }

        .basemap-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #cbd5e1;
            padding: 5px 0;
            text-align: center;
            border-radius: 6px;
            font-size: 0.72rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .basemap-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
        }

        .basemap-btn.active {
            background: #0284c7;
            color: #fff;
            border-color: #38bdf8;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.35);
        }

        .panel-action-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #f1f5f9;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 0.76rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .panel-action-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.2);
        }

        /* 5. Bottom-Center Quick City Selector Chips */
        .floating-city-bar {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 30px;
            padding: 5px 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            gap: 5px;
            overflow-x: auto;
            max-width: 90vw;
        }

        .city-chip {
            background: transparent;
            border: none;
            color: #94a3b8;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.76rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .city-chip:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.08);
        }

        .city-chip.active {
            background: #0284c7;
            color: #ffffff;
            font-weight: 700;
            box-shadow: 0 2px 8px rgba(2, 132, 199, 0.4);
        }

        /* 6. Dynamic Legend Bar (Bottom Right) */
        .temp-legend-bar {
            position: fixed;
            bottom: 16px;
            right: 14px;
            z-index: 1000;
            width: 220px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 10px;
            padding: 6px 10px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
        }

        .legend-ticks {
            display: flex;
            justify-content: space-between;
            font-size: 0.65rem;
            color: var(--text-sub);
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
        }

        .legend-gradient {
            height: 7px;
            width: 100%;
            border-radius: 4px;
            margin: 3px 0;
            transition: background 0.3s ease;
        }

        /* 7. Compact 50%-sized Forecast Window (Modal) */
        .weather-window {
            position: fixed;
            top: 60px;
            left: 14px;
            width: 340px; /* Reduced by 50% from 620px */
            max-width: calc(100vw - 28px);
            max-height: calc(100vh - 110px);
            background: rgba(15, 23, 42, 0.94);
            border: 1px solid rgba(255, 255, 255, 0.16);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 14px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65);
            z-index: 1100;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease;
        }

        .weather-window.hidden {
            transform: scale(0.92) translateY(15px);
            opacity: 0;
            pointer-events: none;
        }

        .weather-window-header {
            padding: 10px 14px;
            background: rgba(30, 41, 59, 0.7);
            border-bottom: 1px solid var(--panel-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .weather-window-header h2 {
            font-size: 0.92rem;
            font-weight: 700;
            color: #f8fafc;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .window-controls {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .window-ctrl-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #94a3b8;
            width: 24px;
            height: 24px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.75rem;
            transition: all 0.2s;
        }

        .window-ctrl-btn:hover {
            background: #ef4444;
            color: #fff;
            border-color: #ef4444;
        }

        .weather-window-body {
            padding: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            user-select: text;
        }

        /* Compact Scrollbar */
        .weather-window-body::-webkit-scrollbar {
            width: 4px;
        }
        .weather-window-body::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 2px;
        }

        /* Compact 2x2 Metric Cards */
        .window-metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }

        .metric-card {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid var(--panel-border);
            padding: 6px 8px;
            border-radius: 8px;
            text-align: center;
        }

        .metric-card h4 {
            color: var(--text-sub);
            font-size: 0.65rem;
            margin-bottom: 2px;
        }

        .metric-value {
            font-size: 1.05rem;
            font-weight: 800;
        }

        .metric-value.max { color: var(--accent-max); }
        .metric-value.min { color: var(--accent-min); }
        .metric-value.diff { color: var(--gold); }
        .metric-value.city { color: var(--primary); font-size: 0.95rem; }

        /* Compact Chart Box with explicit height wrapper (Fixed Chart.js issue) */
        .chart-box {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid var(--panel-border);
            border-radius: 10px;
            padding: 8px 10px;
        }

        .chart-box h3 {
            font-size: 0.78rem;
            color: #e2e8f0;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .chart-canvas-wrapper {
            position: relative;
            height: 110px;
            width: 100%;
        }

        /* Compact Table Box (Reduced by 50%) */
        .table-box {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid var(--panel-border);
            border-radius: 10px;
            padding: 8px;
            overflow-x: auto;
        }

        .table-box h3 {
            font-size: 0.78rem;
            color: #e2e8f0;
            margin-bottom: 6px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.72rem;
        }

        th, td {
            padding: 5px 6px;
            text-align: center;
        }

        th {
            background: rgba(15, 23, 42, 0.7);
            color: var(--primary);
            font-weight: 700;
            border-bottom: 1px solid var(--panel-border);
        }

        td {
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        tr:hover td {
            background: rgba(255, 255, 255, 0.04);
        }

        .temp-high { color: var(--accent-max); font-weight: 700; }
        .temp-low { color: var(--accent-min); font-weight: 700; }

        .status-badge {
            display: inline-block;
            padding: 1px 6px;
            border-radius: 10px;
            font-size: 0.65rem;
            font-weight: 700;
        }
        .status-badge.hot { background: rgba(239, 68, 68, 0.18); color: #fca5a5; }
        .status-badge.comfy { background: rgba(34, 197, 94, 0.18); color: #86efac; }
        .status-badge.cool { background: rgba(56, 189, 248, 0.18); color: #7dd3fc; }

        /* Dynamic Map Markers */
        .weather-marker-bubble {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 3px 8px;
            border-radius: 18px;
            background: rgba(15, 23, 42, 0.94);
            border: 2px solid;
            color: #fff;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.6);
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s;
            white-space: nowrap;
        }

        .weather-marker-bubble:hover {
            transform: scale(1.2);
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.85);
            z-index: 1000 !important;
        }

        .marker-name {
            font-size: 0.72rem;
            font-weight: 600;
            color: #e2e8f0;
        }

        .marker-val {
            font-size: 0.82rem;
            font-weight: 800;
            display: inline-flex;
            align-items: center;
            gap: 2px;
        }

        /* Rotating Wind Arrow */
        .wind-arrow {
            display: inline-block;
            transition: transform 0.3s ease;
        }

        /* Typhoon Center Marker Styling */
        .typhoon-eye-icon {
            font-size: 1.4rem;
            animation: spin-typhoon 4s linear infinite;
            display: inline-block;
            filter: drop-shadow(0 0 8px #f43f5e);
        }

        @keyframes spin-typhoon {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(-360deg); }
        }

        /* Leaflet Dark Popup override */
        .leaflet-popup-content-wrapper {
            background: rgba(15, 23, 42, 0.95) !important;
            color: #f8fafc !important;
            border: 1px solid rgba(56, 189, 248, 0.3) !important;
            border-radius: 12px !important;
            backdrop-filter: blur(12px) !important;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6) !important;
        }
        .leaflet-popup-tip { background: rgba(15, 23, 42, 0.95) !important; }
        .leaflet-popup-content { margin: 10px 12px !important; line-height: 1.4 !important; }

        /* Typhoon Track Time Labels */
        .typhoon-time-label {
            background: rgba(244, 63, 94, 0.88) !important;
            border: 1px solid rgba(255, 255, 255, 0.3) !important;
            color: #fff !important;
            font-size: 0.6rem !important;
            font-weight: 700 !important;
            font-family: 'Outfit', sans-serif !important;
            padding: 1px 5px !important;
            border-radius: 4px !important;
            box-shadow: 0 2px 6px rgba(0,0,0,0.5) !important;
            white-space: nowrap !important;
        }
        .typhoon-time-label::before { display: none !important; }

        .typhoon-forecast-label {
            background: rgba(245, 158, 11, 0.88) !important;
        }

        /* Temperature Pill Badge (matches reference image) */
        .temp-pill {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(145deg, #f59e0b, #f97316);
            border: 2px solid rgba(255, 255, 255, 0.75);
            color: #fff;
            font-size: 0.9rem;
            font-weight: 900;
            font-family: 'Outfit', sans-serif;
            padding: 3px 11px;
            border-radius: 20px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.3);
            white-space: nowrap;
            text-shadow: 0 1px 2px rgba(0,0,0,0.25);
            cursor: pointer;
            transition: transform 0.18s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.18s;
            line-height: 1.2;
        }
        .temp-pill:hover {
            transform: scale(1.18);
            box-shadow: 0 6px 18px rgba(0,0,0,0.6);
        }
        /* cooler temps get blue-green pill */
        .temp-pill.cool  { background: linear-gradient(145deg, #0ea5e9, #06b6d4); }
        .temp-pill.mild  { background: linear-gradient(145deg, #84cc16, #22c55e); }
        .temp-pill.warm  { background: linear-gradient(145deg, #eab308, #f59e0b); }
        .temp-pill.hot   { background: linear-gradient(145deg, #f97316, #ef4444); }
        .temp-pill.vhot  { background: linear-gradient(145deg, #ef4444, #dc2626); }
    </style>
</head>
<body>

    <!-- 1. Fullscreen Map -->
    <div id="map"></div>

    <!-- 2. Top-Left Floating Header with Timestamp -->
    <div class="floating-header">
        <h1>🌦️ 台灣氣象地圖</h1>
        <div class="timestamp-tag" id="displayTimestamp">🕒 資料更新: {{ update_time }}</div>
    </div>

    <!-- 3. Top-Center Interactive Weather Mode & Layer Switcher -->
    <div class="floating-mode-bar">
        <!-- Weather Metric Modes -->
        <button class="mode-btn active" id="mode-temp" onclick="setWeatherMode('temp')">
            <span>🌡️</span><span>氣溫</span>
        </button>
        <button class="mode-btn" id="mode-rain" onclick="setWeatherMode('rain')">
            <span>🌧️</span><span>降雨機率</span>
        </button>
        <button class="mode-btn" id="mode-wind" onclick="setWeatherMode('wind')">
            <span>💨</span><span>風向風速</span>
        </button>
        <button class="mode-btn" id="mode-humid" onclick="setWeatherMode('humid')">
            <span>💧</span><span>溫濕度體感</span>
        </button>
        <button class="mode-btn" id="mode-wx" onclick="setWeatherMode('wx')">
            <span>⛅</span><span>天氣現象</span>
        </button>

        <span style="width: 1px; height: 16px; background: rgba(255,255,255,0.2); margin: 0 2px;"></span>

        <!-- Special Layer Toggles: Typhoon & Weather Stations -->
        <button class="mode-btn toggle-active" id="btn-toggle-typhoon" onclick="toggleTyphoonLayer()">
            <span>🌀</span><span>颱風路徑</span>
        </button>
        <button class="mode-btn toggle-active stations" id="btn-toggle-stations" onclick="toggleStationLayer()">
            <span>📍</span><span>觀測站點</span>
        </button>
    </div>

    <!-- 4. Top-Right Floating Control Panel -->
    <div class="floating-control-panel">
        <button class="panel-action-btn" onclick="toggleChartWindow()" style="background: linear-gradient(135deg, #0284c7, #2563eb); border:none;">
            <span>📈</span><span>縣市走勢報表 (小窗)</span>
        </button>

        <div>
            <div class="panel-section-title">底圖樣式 (暗黑修復)</div>
            <div class="basemap-grid">
                <button id="bm-esridark" class="basemap-btn active" onclick="switchBasemap('esridark')">🌑 極客深色</button>
                <button id="bm-satellite" class="basemap-btn" onclick="switchBasemap('satellite')">🛰️ 衛星影像</button>
                <button id="bm-street" class="basemap-btn" onclick="switchBasemap('street')">🗺️ 街道圖</button>
            </div>
        </div>

        <button class="panel-action-btn" onclick="resetMapCenter()">
            <span>🎯</span><span>重置台灣視角</span>
        </button>

        <button class="panel-action-btn" onclick="syncCwaData()">
            <span id="sync-spinner">🔄</span><span>同步 CWA 最新數據</span>
        </button>
    </div>

    <!-- 5. Bottom-Center Quick City Selector Chips -->
    <div class="floating-city-bar">
        <button class="city-chip active" onclick="selectCity('全台')">📍 全台總覽</button>
        {% for c in cities %}
            <button class="city-chip" id="chip-{{ loop.index }}" onclick="selectCity('{{ c }}')">{{ c }}</button>
        {% endfor %}
    </div>

    <!-- 6. Dynamic Bottom-Right Scale Legend Bar -->
    <div class="temp-legend-bar" id="legendContainer">
        <div class="legend-ticks">
            <span id="legendTitle">氣溫色階</span>
            <span id="legendUnit">°C</span>
        </div>
        <div class="legend-gradient" id="legendGradient"></div>
        <div class="legend-ticks" id="legendLabels">
            <span>15°</span>
            <span>20°</span>
            <span>24°</span>
            <span>28°</span>
            <span>32°</span>
            <span>36°+</span>
        </div>
    </div>

    <!-- 7. Compact 50%-Sized Analytics & Forecast Window -->
    <div id="chart-window" class="weather-window">
        <!-- Window Header -->
        <div class="weather-window-header">
            <h2>
                <span>📊</span>
                <span id="windowLocationTitle">{{ selected_location }} 預報走勢</span>
            </h2>
            <div class="window-controls">
                <select id="modalLocationSelect" onchange="selectCity(this.value)" style="background: rgba(15,23,42,0.85); color: #fff; border: 1px solid rgba(255,255,255,0.25); padding: 2px 6px; border-radius: 6px; font-size: 0.75rem; font-weight:600; cursor: pointer; outline:none;">
                    {% for c in cities %}
                        <option value="{{ c }}" {% if c == selected_location %}selected{% endif %}>{{ c }}</option>
                    {% endfor %}
                </select>
                <button class="window-ctrl-btn" onclick="closeChartWindow()" title="關閉視窗">✕</button>
            </div>
        </div>

        <!-- Compact Window Body -->
        <div class="weather-window-body">
            <!-- 2x2 Metric Cards -->
            <div class="window-metrics-grid">
                <div class="metric-card">
                    <h4>目前縣市 / 區域</h4>
                    <div class="metric-value city" id="kpi-location">{{ selected_location }}</div>
                </div>
                <div class="metric-card">
                    <h4>天氣狀況 / 舒適度</h4>
                    <div class="metric-value diff" id="kpi-wx" style="font-size:0.88rem;">--</div>
                </div>
                <div class="metric-card">
                    <h4>最高溫 / 最低溫</h4>
                    <div class="metric-value" style="font-size:0.9rem;">
                        <span class="max" id="kpi-maxt">--</span> / <span class="min" id="kpi-mint">--</span>
                    </div>
                </div>
                <div class="metric-card">
                    <h4>降雨機率 / 風速</h4>
                    <div class="metric-value" style="font-size:0.85rem; color:#38bdf8;" id="kpi-pop-wind">--</div>
                </div>
            </div>

            <!-- Compact Fixed-Height Chart.js Container -->
            <div class="chart-box">
                <h3>
                    <span>📈 氣溫走勢曲線</span>
                    <span style="font-size: 0.68rem; color: var(--text-sub);">單位: °C</span>
                </h3>
                <div class="chart-canvas-wrapper">
                    <canvas id="tempChart"></canvas>
                </div>
            </div>

            <!-- Compact 50%-sized Data Table Box -->
            <div class="table-box">
                <h3>📋 預報明細與體感指標</h3>
                <table>
                    <thead>
                        <tr>
                            <th>日期</th>
                            <th>氣溫</th>
                            <th>天氣</th>
                            <th>降雨</th>
                            <th>舒適度</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <!-- Populated by JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script>
        // Server injected data
        const allRecords = {{ all_records|tojson }};
        const allCities = {{ cities|tojson }};
        const typhoonsData = {{ typhoons|tojson }};
        const stationsData = {{ stations|tojson }};
        let currentSelectedLocation = "{{ selected_location }}";
        let currentMode = "temp"; // 'temp', 'rain', 'wind', 'humid', 'wx'
        let showTyphoon = true;
        let showStations = true;

        // Precise geographic coordinates for all 22 counties/cities of Taiwan
        const cityCoords = {
            "基隆市": [25.13, 121.74],
            "臺北市": [25.04, 121.56],
            "新北市": [24.99, 121.46],
            "桃園市": [24.99, 121.30],
            "新竹市": [24.81, 120.97],
            "新竹縣": [24.84, 121.01],
            "宜蘭縣": [24.76, 121.75],
            "苗栗縣": [24.56, 120.82],
            "臺中市": [24.16, 120.68],
            "彰化縣": [24.08, 120.54],
            "南投縣": [23.91, 120.69],
            "雲林縣": [23.71, 120.43],
            "嘉義市": [23.48, 120.45],
            "嘉義縣": [23.45, 120.26],
            "臺南市": [22.99, 120.21],
            "高雄市": [22.63, 120.31],
            "屏東縣": [22.67, 120.49],
            "花蓮縣": [23.99, 121.60],
            "臺東縣": [22.76, 121.14],
            "澎湖縣": [23.57, 119.58],
            "金門縣": [24.44, 118.38],
            "連江縣": [26.16, 119.95]
        };

        // 1. Initialize Leaflet Map (Centered on Taiwan)
        const map = L.map('map', {
            center: [23.85, 120.95],
            zoom: 7.8,
            zoomControl: false
        });

        // Add Zoom Control to Bottom Left
        L.control.zoom({ position: 'topleft' }).addTo(map);

        // ── Bulletproof Base Map Layers ─────────────────────────
        const esriDarkTileLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
            attribution: '&copy; Esri, DeLorme, NAVTEQ',
            maxZoom: 16
        });

        const cartoDarkTileLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
            subdomains: 'abcd',
            maxZoom: 19
        });

        const satelliteTileLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: '&copy; Esri, Maxar, Earthstar Geographics',
            maxZoom: 18
        });

        const streetTileLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors',
            maxZoom: 19
        });

        // Default basemap: ESRI Dark Gray Base
        esriDarkTileLayer.addTo(map);
        let currentBasemap = 'esridark';

        const basemapLayers = {
            'esridark': esriDarkTileLayer,
            'satellite': satelliteTileLayer,
            'street': streetTileLayer
        };

        function switchBasemap(type) {
            if (currentBasemap === type) return;
            map.removeLayer(basemapLayers[currentBasemap]);
            basemapLayers[type].addTo(map);
            currentBasemap = type;

            document.querySelectorAll('.basemap-btn').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.getElementById('bm-' + type);
            if (activeBtn) activeBtn.classList.add('active');
        }

        function resetMapCenter() {
            map.flyTo([23.85, 120.95], 7.8, { duration: 1.0 });
        }

        // ── 2. Layer Groups (order = bottom to top) ─────────────
        const choroplethGroup = L.layerGroup().addTo(map); // temp fill BELOW markers
        const markerGroup = L.layerGroup().addTo(map);
        const typhoonLayerGroup = L.layerGroup().addTo(map);
        const stationLayerGroup = L.layerGroup().addTo(map);
        const markersByCity = {};

        // Find Latest Record per City
        const latestByCity = {};
        allRecords.forEach(r => {
            if (!latestByCity[r.locationName]) {
                latestByCity[r.locationName] = r;
            }
        });

        // GeoJSON source for Taiwan administrative boundaries (Chinese county names: COUNTYNAME)
        const TW_GEO_URLS = [
            'https://raw.githubusercontent.com/ronnywang/twgeojson/master/twCounty2010.geo.json',
            'https://raw.githubusercontent.com/g0v/twgeojson/master/json/twCounty2010.geo.json'
        ];
        // English → Chinese name fallback mapping (for GeoJSON sources with English names)
        const GEO_EN_TO_ZH = {
            'Taipei City':'臺北市','New Taipei City':'新北市','Taoyuan City':'桃園市',
            'Taichung City':'臺中市','Tainan City':'臺南市','Kaohsiung City':'高雄市',
            'Keelung City':'基隆市','Hsinchu City':'新竹市','Chiayi City':'嘉義市',
            'Hsinchu County':'新竹縣','Miaoli County':'苗栗縣','Changhua County':'彰化縣',
            'Nantou County':'南投縣','Yunlin County':'雲林縣','Chiayi County':'嘉義縣',
            'Pingtung County':'屏東縣','Yilan County':'宜蘭縣','Hualien County':'花蓮縣',
            'Taitung County':'臺東縣','Penghu County':'澎湖縣','Kinmen County':'金門縣',
            'Lienchiang County':'連江縣'
        };
        let _cachedGeoJSON = null;

        async function loadTaiwanGeoJSON() {
            if (_cachedGeoJSON) return _cachedGeoJSON;
            for (const url of TW_GEO_URLS) {
                try {
                    const res = await fetch(url);
                    if (!res.ok) continue;
                    _cachedGeoJSON = await res.json();
                    return _cachedGeoJSON;
                } catch(e) { /* try next URL */ }
            }
            return null;
        }

        function resolveCountyName(props) {
            return props.COUNTYNAME || props.COUNTY_NAM || props.countyname ||
                   GEO_EN_TO_ZH[props.name] || GEO_EN_TO_ZH[props.NAME] || '';
        }

        // ── Smooth Color Interpolation Engine ─────────────────
        // Linearly interpolate between two values
        function lerp(a, b, t) { return a + (b - a) * t; }

        // Interpolate across a palette of [R,G,B] stops given t in [0,1]
        function interpolateRGB(stops, t) {
            t = Math.max(0, Math.min(1, t));
            const n = stops.length - 1;
            const i = Math.min(Math.floor(t * n), n - 1);
            const f = t * n - i;
            const c1 = stops[i], c2 = stops[i + 1];
            const r = Math.round(lerp(c1[0], c2[0], f));
            const g = Math.round(lerp(c1[1], c2[1], f));
            const b = Math.round(lerp(c1[2], c2[2], f));
            return `rgb(${r},${g},${b})`;
        }

        // Temperature gradient stops: 15°C (cold blue) → 38°C (hot red)
        // Every 1°C maps smoothly to a unique color
        const TEMP_COLOR_STOPS = [
            [44,  123, 182],  // 15° deep blue
            [90,  164, 208],  // 17° sky blue
            [171, 217, 233],  // 19° light blue
            [224, 243, 248],  // 21° pale cyan
            [168, 219, 168],  // 23° light green
            [120, 198, 121],  // 25° green
            [255, 255, 178],  // 27° light yellow
            [254, 217,  83],  // 29° yellow-orange
            [253, 174,  97],  // 31° orange
            [240, 110,  60],  // 33° deep orange
            [215,  48,  39],  // 35° red-orange
            [165,   0,  38],  // 37° dark red
            [110,   0,  20],  // 38°+ maroon
        ];
        const TEMP_MIN = 15, TEMP_MAX = 38;

        function getTempColor(temp) {
            const t = (temp - TEMP_MIN) / (TEMP_MAX - TEMP_MIN);
            return interpolateRGB(TEMP_COLOR_STOPS, t);
        }

        function getTempFillStyle(temp) {
            const t = (temp - TEMP_MIN) / (TEMP_MAX - TEMP_MIN);
            const color = interpolateRGB(TEMP_COLOR_STOPS, t);
            // Higher temps = more opaque fill
            const opacity = 0.38 + Math.min(0.28, Math.max(0, t) * 0.28);
            return { color, opacity };
        }

        // Precipitation gradient stops: 0% (dry white-green) → 100% (saturated blue-purple)
        const RAIN_COLOR_STOPS = [
            [240, 249, 255],  // 0%   near-white (dry)
            [186, 228, 248],  // 10%  very light blue
            [106, 192, 236],  // 20%  light blue
            [ 54, 162, 220],  // 30%  medium sky blue
            [ 15, 134, 200],  // 40%  blue
            [  7, 107, 181],  // 50%  deeper blue
            [ 11,  78, 161],  // 60%  dark blue
            [ 29,  55, 148],  // 70%  navy
            [ 63,  35, 155],  // 80%  indigo
            [107,  29, 185],  // 90%  violet
            [139,   2, 139],  // 100% purple
        ];

        function getRainColor(pop) {
            const t = Math.max(0, Math.min(100, pop)) / 100;
            return interpolateRGB(RAIN_COLOR_STOPS, t);
        }

        function getRainFillStyle(pop) {
            const t = Math.max(0, Math.min(100, pop)) / 100;
            const color = interpolateRGB(RAIN_COLOR_STOPS, t);
            // More rain = more visible
            const opacity = 0.18 + t * 0.52;
            return { color, opacity };
        }

        // ── Combined Choropleth Renderer (handles both temp and rain) ───
        async function renderChoropleth() {
            choroplethGroup.clearLayers();
            if (currentMode !== 'temp' && currentMode !== 'rain') return;

            const geojson = await loadTaiwanGeoJSON();

            function getStyle(feature) {
                const countyName = resolveCountyName(feature.properties);
                const data = latestByCity[countyName] || {};
                let fillColor, fillOpacity;

                if (currentMode === 'temp') {
                    const avgTemp = (data.mint !== undefined && data.maxt !== undefined)
                        ? (Number(data.mint) + Number(data.maxt)) / 2 : 26;
                    const s = getTempFillStyle(avgTemp);
                    fillColor = s.color;
                    fillOpacity = s.opacity;
                } else { // rain
                    const pop = parseInt(data.pop || '20', 10);
                    const s = getRainFillStyle(pop);
                    fillColor = s.color;
                    fillOpacity = s.opacity;
                }

                return {
                    fillColor: fillColor,
                    fillOpacity: fillOpacity,
                    color: 'rgba(130, 150, 190, 0.5)',
                    weight: 1.4,
                    opacity: 0.8
                };
            }

            if (geojson) {
                L.geoJSON(geojson, {
                    style: getStyle,
                    onEachFeature: function(feature, layer) {
                        layer.on('click', function() {
                            const countyName = resolveCountyName(feature.properties);
                            if (countyName && allCities.includes(countyName)) {
                                selectCity(countyName);
                                openChartWindow();
                            }
                        });
                    }
                }).addTo(choroplethGroup);
            } else {
                // Fallback: circles per city
                Object.keys(cityCoords).forEach(cityName => {
                    const coords = cityCoords[cityName];
                    const data = latestByCity[cityName] || {};
                    let fillColor, fillOpacity;
                    if (currentMode === 'temp') {
                        const avgTemp = (data.mint !== undefined && data.maxt !== undefined)
                            ? (Number(data.mint) + Number(data.maxt)) / 2 : 26;
                        const s = getTempFillStyle(avgTemp);
                        fillColor = s.color; fillOpacity = s.opacity;
                    } else {
                        const pop = parseInt(data.pop || '20', 10);
                        const s = getRainFillStyle(pop);
                        fillColor = s.color; fillOpacity = s.opacity;
                    }
                    L.circle(coords, {
                        radius: 28000,
                        color: 'rgba(130,150,190,0.5)',
                        fillColor, fillOpacity, weight: 1.2
                    }).addTo(choroplethGroup);
                });
            }
        }

        // Keep alias for backward-compat calls
        const renderTempFill = renderChoropleth;

        // ── 3. Typhoon Track Rendering ──────────────────────────
        function renderTyphoonTracks() {
            typhoonLayerGroup.clearLayers();
            if (!showTyphoon || !typhoonsData || typhoonsData.length === 0) return;

            typhoonsData.forEach(ty => {
                const pastPts = ty.past || [];
                const fcPts = ty.forecast || [];

                // 1. Draw Past Track Line (Red solid line)
                if (pastPts.length > 1) {
                    const latlngs = pastPts.map(p => [p.lat, p.lng]);
                    L.polyline(latlngs, {
                        color: '#f43f5e',
                        weight: 3.5,
                        opacity: 0.85
                    }).addTo(typhoonLayerGroup);

                    // Past points dots with time labels
                    pastPts.forEach((p, idx) => {
                        const pTime = p.time ? p.time.replace('T', ' ').substring(5, 16) : '';
                        const showLabel = (idx % 2 === 0 || idx === pastPts.length - 1);

                        if (showLabel) {
                            const ptMarker = L.circleMarker([p.lat, p.lng], {
                                radius: 4,
                                color: '#ffffff',
                                fillColor: '#f43f5e',
                                fillOpacity: 0.9,
                                weight: 1.5
                            }).addTo(typhoonLayerGroup);

                            // Time label tooltip always visible
                            if (pTime) {
                                ptMarker.bindTooltip(pTime, {
                                    permanent: true,
                                    direction: 'top',
                                    offset: [0, -6],
                                    className: 'typhoon-time-label'
                                });
                            }

                            ptMarker.bindPopup(`
                                <div style="font-size:0.8rem; text-align:center;">
                                    <b style="color:#f43f5e;">🌀 ${ty.name} (歷史位置)</b><br>
                                    時間: ${pTime}<br>
                                    風速: ${p.wind} m/s ｜ 氣壓: ${p.pressure} hPa<br>
                                    移速: ${p.speed} km/h (${p.dir})
                                </div>
                            `);
                        }
                    });
                }

                // 2. Current Eye Position
                if (pastPts.length > 0) {
                    const currentEye = pastPts[pastPts.length - 1];
                    const eyeIcon = L.divIcon({
                        html: `<span class="typhoon-eye-icon">🌀</span>`,
                        className: '',
                        iconSize: [28, 28],
                        iconAnchor: [14, 14]
                    });

                    const eyeMarker = L.marker([currentEye.lat, currentEye.lng], { icon: eyeIcon }).addTo(typhoonLayerGroup);
                    eyeMarker.bindPopup(`
                        <div style="font-size:0.85rem; text-align:center; min-width:140px;">
                            <div style="font-size:1.0rem; font-weight:800; color:#f43f5e;">🌀 ${ty.name} 現行中心</div>
                            <div style="font-size:0.75rem; color:#94a3b8; margin:3px 0;">緯度: ${currentEye.lat}°N ｜ 經度: ${currentEye.lng}°E</div>
                            <div style="color:#f8fafc; font-weight:700;">近中心最大風速: ${currentEye.wind} m/s</div>
                            <div style="color:#cbd5e1; font-size:0.75rem;">中心氣壓: ${currentEye.pressure} hPa</div>
                            <div style="color:#cbd5e1; font-size:0.75rem;">移動: ${currentEye.dir} 向 ${currentEye.speed} km/h</div>
                        </div>
                    `);
                }

                // 3. Draw Forecast Track Line (Yellow/Orange dashed line)
                if (fcPts.length > 0 && pastPts.length > 0) {
                    const currentEye = pastPts[pastPts.length - 1];
                    const fcCoords = [[currentEye.lat, currentEye.lng], ...fcPts.map(p => [p.lat, p.lng])];

                    L.polyline(fcCoords, {
                        color: '#f59e0b',
                        weight: 2.5,
                        dashArray: '6, 8',
                        opacity: 0.9
                    }).addTo(typhoonLayerGroup);

                    // Forecast points and 70% probability circles
                    fcPts.forEach(p => {
                        // 70% Probability Cone Circle
                        if (p.radius && p.radius > 0) {
                            L.circle([p.lat, p.lng], {
                                radius: p.radius * 1000,
                                color: '#f59e0b',
                                fillColor: '#f59e0b',
                                fillOpacity: 0.1,
                                weight: 1
                            }).addTo(typhoonLayerGroup);
                        }

                        // Forecast Dot
                        const fcMarker = L.circleMarker([p.lat, p.lng], {
                            radius: 4.5,
                            color: '#ffffff',
                            fillColor: '#f59e0b',
                            fillOpacity: 1,
                            weight: 1.5
                        }).addTo(typhoonLayerGroup);

                        // Time label on forecast nodes
                        const fcTime = p.time ? p.time.replace('T', ' ').substring(5, 16) : (p.hour ? `+${p.hour}h` : '');
                        if (fcTime) {
                            fcMarker.bindTooltip(fcTime, {
                                permanent: true,
                                direction: 'top',
                                offset: [0, -6],
                                className: 'typhoon-time-label typhoon-forecast-label'
                            });
                        }

                        fcMarker.bindPopup(`
                            <div style="font-size:0.8rem; text-align:center;">
                                <b style="color:#f59e0b;">🔮 ${ty.name} 預測位置 (+${p.hour}小時)</b><br>
                                時間: ${fcTime}<br>
                                預測風速: ${p.wind} m/s<br>
                                70% 暴風機率半徑: ${p.radius} km
                            </div>
                        `);
                    });
                }
            });
        }

        function toggleTyphoonLayer() {
            showTyphoon = !showTyphoon;
            const btn = document.getElementById('btn-toggle-typhoon');
            if (showTyphoon) {
                btn.classList.add('toggle-active');
                renderTyphoonTracks();
            } else {
                btn.classList.remove('toggle-active');
                typhoonLayerGroup.clearLayers();
            }
        }

        // ── 4. Weather Station Locations (Dots) Rendering ──────
        function renderStationDots() {
            stationLayerGroup.clearLayers();
            if (!showStations || !stationsData || stationsData.length === 0) return;

            stationsData.forEach(st => {
                const dot = L.circleMarker([st.lat, st.lng], {
                    radius: 3.5,
                    color: '#ffffff',
                    fillColor: '#38bdf8',
                    fillOpacity: 0.85,
                    weight: 1
                }).addTo(stationLayerGroup);

                dot.bindPopup(`
                    <div style="font-size:0.8rem; text-align:center; min-width:130px;">
                        <div style="font-size:0.92rem; font-weight:800; color:#38bdf8; margin-bottom:2px;">📍 ${st.name} 測站</div>
                        <div style="font-size:0.72rem; color:#94a3b8; margin-bottom:4px;">${st.county}</div>
                        <div style="color:#f8fafc; font-weight:700;">氣溫: ${st.temp}°C ｜ 濕度: ${st.humid}%</div>
                        <div style="color:#cbd5e1; font-size:0.75rem;">風速: ${st.wind} m/s ｜ 雨量: ${st.rain} mm</div>
                        <div style="color:#cbd5e1; font-size:0.75rem;">天氣現象: ${st.wx}</div>
                    </div>
                `);
            });
        }

        function toggleStationLayer() {
            showStations = !showStations;
            const btn = document.getElementById('btn-toggle-stations');
            if (showStations) {
                btn.classList.add('toggle-active', 'stations');
                renderStationDots();
            } else {
                btn.classList.remove('toggle-active', 'stations');
                stationLayerGroup.clearLayers();
            }
        }

        // ── 5. County Weather Markers Rendering ─────────────────
        function getMarkerContent(cityName, mode) {
            const data = latestByCity[cityName] || {};
            const avgTemp = data.mint && data.maxt ? (data.mint + data.maxt) / 2 : 25;
            const shortName = cityName.replace('市', '').replace('縣', '');

            switch (mode) {
                case 'temp': {
                    const t = Math.round(avgTemp);
                    let pillClass = 'warm';
                    if (t >= 32) pillClass = 'vhot';
                    else if (t >= 29) pillClass = 'hot';
                    else if (t >= 26) pillClass = 'warm';
                    else if (t >= 23) pillClass = 'mild';
                    else pillClass = 'cool';
                    return {
                        html: `<div class="temp-pill ${pillClass}">${t}°</div>`,
                        color: getTempColor(avgTemp),
                        isPill: true
                    };
                }
                case 'rain': {
                    const pop = parseInt(data.pop || '10', 10);
                    const color = getRainColor(pop);
                    // Pill class based on intensity
                    let pillClass = 'rain-low';
                    if (pop >= 70) pillClass = 'rain-heavy';
                    else if (pop >= 40) pillClass = 'rain-med';
                    return {
                        html: `<div class="temp-pill" style="background: linear-gradient(145deg, ${getRainColor(Math.max(0,pop-15))}, ${color}); border-color: rgba(255,255,255,0.6);">${pop}%</div>`,
                        color: color,
                        isPill: true
                    };
                }
                case 'wind': {
                    const speed = data.windSpeed !== undefined ? Number(data.windSpeed).toFixed(1) : '2.0';
                    const dir = data.windDirection !== undefined ? Number(data.windDirection) : 45;
                    let color = '#22c55e';
                    if (parseFloat(speed) >= 5) color = '#ef4444';
                    else if (parseFloat(speed) >= 3) color = '#f59e0b';
                    return {
                        html: `<span class="marker-name">${shortName}</span><span class="marker-val" style="color:${color};"><span class="wind-arrow" style="transform:rotate(${dir}deg);">↑</span> ${speed}m/s</span>`,
                        color: color
                    };
                }
                case 'humid': {
                    const humid = data.humidity !== undefined ? Math.round(data.humidity) : 75;
                    let color = '#38bdf8';
                    if (humid >= 80) color = '#6366f1';
                    else if (humid >= 65) color = '#06b6d4';
                    return {
                        html: `<span class="marker-name">${shortName}</span><span class="marker-val" style="color:${color};">💧 ${humid}%</span>`,
                        color: color
                    };
                }
                case 'wx': {
                    const wx = data.wx || '多雲';
                    let icon = '⛅';
                    let color = '#38bdf8';
                    if (wx.includes('晴')) { icon = '☀️'; color = '#fbbf24'; }
                    if (wx.includes('雨')) { icon = '🌧️'; color = '#60a5fa'; }
                    if (wx.includes('雷')) { icon = '⛈️'; color = '#c084fc'; }
                    const shortWx = wx.length > 3 ? wx.substring(0, 3) : wx;
                    return {
                        html: `<span class="marker-name">${shortName}</span><span class="marker-val" style="color:${color};">${icon} ${shortWx}</span>`,
                        color: color
                    };
                }
                default:
                    return {
                        html: `<span class="marker-name">${shortName}</span><span class="marker-val">🌡️ ${Math.round(avgTemp)}°C</span>`,
                        color: '#38bdf8'
                    };
            }
        }

        function renderMarkers() {
            markerGroup.clearLayers();

            Object.keys(cityCoords).forEach(cityName => {
                const coords = cityCoords[cityName];
                const contentInfo = getMarkerContent(cityName, currentMode);
                const data = latestByCity[cityName] || {};

                const iconHtml = contentInfo.isPill
                    ? contentInfo.html
                    : `<div class="weather-marker-bubble" style="border-color: ${contentInfo.color};">${contentInfo.html}</div>`;
                const iconW = contentInfo.isPill ? 52 : 95;
                const iconH = contentInfo.isPill ? 30 : 28;

                const customIcon = L.divIcon({
                    html: iconHtml,
                    className: '',
                    iconSize: [iconW, iconH],
                    iconAnchor: [iconW/2, iconH/2]
                });

                const marker = L.marker(coords, { icon: customIcon }).addTo(markerGroup);
                markersByCity[cityName] = marker;

                // Rich Popup Information
                const wx = data.wx || '多雲';
                const pop = data.pop ? data.pop + '%' : '10%';
                const mint = data.mint !== undefined ? data.mint + '°C' : '--';
                const maxt = data.maxt !== undefined ? data.maxt + '°C' : '--';
                const wind = data.windSpeed !== undefined ? data.windSpeed + ' m/s' : '--';
                const humid = data.humidity !== undefined ? data.humidity + '%' : '--';
                const ci = data.ci || '舒適';

                const popupHtml = `
                    <div style="font-family:'Noto Sans TC',sans-serif; text-align:center; min-width: 160px;">
                        <div style="font-size:1.0rem; font-weight:800; color:#38bdf8; margin-bottom:2px;">${cityName}</div>
                        <div style="font-size:0.75rem; color:#94a3b8; margin-bottom:6px;">${wx} ｜ 體感：${ci}</div>
                        <div style="font-size:0.8rem; color:#cbd5e1; margin-bottom:4px;">
                            低: <b style="color:#38bdf8">${mint}</b> ｜ 高: <b style="color:#ef4444">${maxt}</b>
                        </div>
                        <div style="font-size:0.75rem; color:#94a3b8; margin-bottom:8px;">
                            🌧️ 降雨: <b>${pop}</b> ｜ 💨 風速: <b>${wind}</b> ｜ 💧 濕度: <b>${humid}</b>
                        </div>
                        <button onclick="selectCity('${cityName}'); openChartWindow();" style="background:linear-gradient(135deg, #0284c7, #2563eb); color:#fff; border:none; padding:5px 10px; border-radius:6px; font-size:0.75rem; font-weight:700; cursor:pointer; width:100%;">
                            📊 查看 ${cityName} 報表走勢
                        </button>
                    </div>
                `;
                marker.bindPopup(popupHtml);

                marker.on('click', () => {
                    selectCity(cityName);
                    openChartWindow();
                });
            });
        }

        // ── 6. Mode Switcher Handler ────────────────────────────
        function setWeatherMode(mode) {
            currentMode = mode;

            // Highlight mode buttons
            document.querySelectorAll('.mode-btn').forEach(btn => {
                if (btn.id.startsWith('mode-')) {
                    btn.classList.remove('active');
                }
            });
            const activeBtn = document.getElementById('mode-' + mode);
            if (activeBtn) activeBtn.classList.add('active');

            // Update Legend
            updateLegend(mode);

            // Re-render markers and choropleth (temp & rain get area fill)
            renderMarkers();
            renderChoropleth(); // async – fire and forget
        }

        function updateLegend(mode) {
            const title = document.getElementById('legendTitle');
            const unit = document.getElementById('legendUnit');
            const gradient = document.getElementById('legendGradient');
            const labels = document.getElementById('legendLabels');

            switch (mode) {
                case 'temp':
                    title.innerText = '氣溫色階';
                    unit.innerText = '°C';
                    gradient.style.background = 'linear-gradient(to right, rgb(44,123,182), rgb(171,217,233), rgb(168,219,168), rgb(255,255,178), rgb(253,174,97), rgb(215,48,39), rgb(110,0,20))';
                    labels.innerHTML = '<span>15°</span><span>19°</span><span>23°</span><span>27°</span><span>31°</span><span>35°</span><span>38°+</span>';
                    break;
                case 'rain':
                    title.innerText = '降雨機率色階';
                    unit.innerText = '%';
                    gradient.style.background = 'linear-gradient(to right, rgb(240,249,255), rgb(106,192,236), rgb(15,134,200), rgb(11,78,161), rgb(63,35,155), rgb(139,2,139))';
                    labels.innerHTML = '<span>0%</span><span>20%</span><span>40%</span><span>60%</span><span>80%</span><span>100%</span>';
                    break;
                case 'wind':
                    title.innerText = '風速大小';
                    unit.innerText = 'm/s';
                    gradient.style.background = 'linear-gradient(to right, #22c55e, #10b981, #f59e0b, #f97316, #ef4444)';
                    labels.innerHTML = '<span>0</span><span>2</span><span>4</span><span>6</span><span>8</span><span>10+</span>';
                    break;
                case 'humid':
                    title.innerText = '相對濕度';
                    unit.innerText = '%';
                    gradient.style.background = 'linear-gradient(to right, #fef08a, #86efac, #38bdf8, #6366f1)';
                    labels.innerHTML = '<span>40%</span><span>55%</span><span>70%</span><span>85%</span><span>100%</span>';
                    break;
                case 'wx':
                    title.innerText = '天氣型態';
                    unit.innerText = '圖示';
                    gradient.style.background = 'linear-gradient(to right, #fbbf24, #94a3b8, #60a5fa, #818cf8)';
                    labels.innerHTML = '<span>晴天</span><span>多雲</span><span>短暫雨</span><span>雷雨</span>';
                    break;
            }
        }

        // ── 7. Bulletproof Chart.js Instance & Table Update ─────
        let tempChart = null;

        function updateChartAndTable(cityName) {
            const cityData = allRecords.filter(r => r.locationName === cityName);

            // Update Titles & Selectors
            document.getElementById('windowLocationTitle').innerText = `${cityName} 預報走勢`;
            document.getElementById('kpi-location').innerText = cityName;
            const selectEl = document.getElementById('modalLocationSelect');
            if (selectEl) selectEl.value = cityName;

            if (cityData.length > 0) {
                const first = cityData[0];
                document.getElementById('kpi-maxt').innerText = `${first.maxt}°`;
                document.getElementById('kpi-mint').innerText = `${first.mint}°`;
                document.getElementById('kpi-wx').innerText = `${first.wx || '多雲'} · ${first.ci || '舒適'}`;
                document.getElementById('kpi-pop-wind').innerText = `🌧️ ${first.pop || '0'}% ｜ 💨 ${first.windSpeed || '2.2'}m/s`;
            } else {
                document.getElementById('kpi-maxt').innerText = '--';
                document.getElementById('kpi-mint').innerText = '--';
                document.getElementById('kpi-wx').innerText = '--';
                document.getElementById('kpi-pop-wind').innerText = '--';
            }

            // Clean, Safe Chart Labels & Values
            const labels = cityData.map(r => {
                const d = String(r.dataDate || '');
                return d.length > 5 ? d.substring(5) : d;
            });
            const minTemps = cityData.map(r => Number(r.mint));
            const maxTemps = cityData.map(r => Number(r.maxt));

            // Cleanly destroy previous chart instance to prevent canvas memory/sizing leaks
            if (tempChart) {
                tempChart.destroy();
                tempChart = null;
            }

            const canvas = document.getElementById('tempChart');
            if (canvas) {
                const ctx = canvas.getContext('2d');
                tempChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels.length > 0 ? labels : ['今日', '明日'],
                        datasets: [
                            {
                                label: '最高溫',
                                data: maxTemps.length > 0 ? maxTemps : [32, 30],
                                borderColor: '#ef4444',
                                backgroundColor: 'rgba(239, 68, 68, 0.12)',
                                borderWidth: 2.5,
                                tension: 0.35,
                                fill: true,
                                pointRadius: 3.5,
                                pointHoverRadius: 6,
                                pointBackgroundColor: '#ef4444'
                            },
                            {
                                label: '最低溫',
                                data: minTemps.length > 0 ? minTemps : [25, 24],
                                borderColor: '#38bdf8',
                                backgroundColor: 'rgba(56, 189, 248, 0.12)',
                                borderWidth: 2.5,
                                tension: 0.35,
                                fill: true,
                                pointRadius: 3.5,
                                pointHoverRadius: 6,
                                pointBackgroundColor: '#38bdf8'
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        interaction: {
                            mode: 'index',
                            intersect: false
                        },
                        plugins: {
                            legend: {
                                labels: {
                                    color: '#cbd5e1',
                                    font: { family: 'Outfit', size: 10, weight: '600' },
                                    boxWidth: 10,
                                    padding: 6
                                }
                            },
                            tooltip: {
                                backgroundColor: 'rgba(15, 23, 42, 0.94)',
                                titleFont: { size: 11 },
                                bodyFont: { size: 10 },
                                padding: 6,
                                cornerRadius: 6
                            }
                        },
                        scales: {
                            x: {
                                ticks: { color: '#94a3b8', font: { size: 9 } },
                                grid: { color: 'rgba(255,255,255,0.04)' }
                            },
                            y: {
                                ticks: {
                                    color: '#94a3b8',
                                    font: { size: 9 },
                                    callback: function(v) { return v + '°'; }
                                },
                                grid: { color: 'rgba(255,255,255,0.04)' }
                            }
                        }
                    }
                });
            }

            // Compact Table Data
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            if (cityData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5">暫無此縣市資料</td></tr>';
            } else {
                cityData.forEach(rec => {
                    const avg = (Number(rec.maxt) + Number(rec.mint)) / 2;
                    let badgeHtml = '<span class="status-badge comfy">舒適</span>';
                    if (avg >= 28) badgeHtml = '<span class="status-badge hot">炎熱</span>';
                    else if (avg < 22) badgeHtml = '<span class="status-badge cool">涼爽</span>';

                    const dStr = String(rec.dataDate || '');
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td><strong>${dStr.length > 5 ? dStr.substring(5) : dStr}</strong></td>
                        <td><span class="temp-low">${rec.mint}°</span> / <span class="temp-high">${rec.maxt}°</span></td>
                        <td>${rec.wx || '多雲'}</td>
                        <td style="color:#38bdf8;">🌧️ ${rec.pop || '0'}%</td>
                        <td>${badgeHtml}</td>
                    `;
                    tbody.appendChild(row);
                });
            }
        }

        // ── 8. City Selection ───────────────────────────────────
        function selectCity(cityName) {
            currentSelectedLocation = cityName;

            // Highlight chips
            document.querySelectorAll('.city-chip').forEach(chip => {
                if (chip.innerText === cityName || (cityName === '全台' && chip.innerText.includes('全台'))) {
                    chip.classList.add('active');
                } else {
                    chip.classList.remove('active');
                }
            });

            if (cityName === '全台') {
                resetMapCenter();
            } else {
                const coords = cityCoords[cityName];
                if (coords) {
                    map.flyTo(coords, 10, { duration: 0.9 });
                    if (markersByCity[cityName]) {
                        markersByCity[cityName].openPopup();
                    }
                }
                updateChartAndTable(cityName);
            }
        }

        // ── 9. Window Controls ──────────────────────────────────
        const chartWindow = document.getElementById('chart-window');

        function toggleChartWindow() {
            if (chartWindow.classList.contains('hidden')) {
                openChartWindow();
            } else {
                closeChartWindow();
            }
        }

        function openChartWindow() {
            chartWindow.classList.remove('hidden');
            if (currentSelectedLocation === '全台') {
                updateChartAndTable(allCities[0] || '臺北市');
            } else {
                updateChartAndTable(currentSelectedLocation);
            }
        }

        function closeChartWindow() {
            chartWindow.classList.add('hidden');
        }

        // ── 10. CWA Data Sync ───────────────────────────────────
        async function syncCwaData() {
            const spinner = document.getElementById('sync-spinner');
            spinner.innerText = "⏳";
            try {
                const res = await fetch('/api/sync');
                const data = await res.json();
                if (data.status === "success") {
                    if (data.update_time) {
                        document.getElementById('displayTimestamp').innerText = `🕒 資料更新: ${data.update_time}`;
                    }
                    alert(`✅ 氣象、颱風路徑與觀測站資料同步成功！已更新 ${data.count} 筆各縣市資料。`);
                    window.location.reload();
                } else {
                    alert("❌ 同步失敗: " + data.message);
                }
            } catch (err) {
                alert("❌ 發送同步請求失敗: " + err);
            } finally {
                spinner.innerText = "🔄";
            }
        }

        // Initial Setup
        renderMarkers();
        renderTyphoonTracks();
        renderStationDots();
        renderTempFill(); // async GeoJSON choropleth – loads after page paint
        updateChartAndTable(currentSelectedLocation);
    </script>
</body>
</html>

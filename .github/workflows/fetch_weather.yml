name: Automated Weather Data Sync

on:
  schedule:
    # 每天早上 6:00 與下午 18:00 UTC (對應台灣時間 14:00 與 02:00) 自動同步
    - cron: '0 6,18 * * *'
  workflow_dispatch: # 支援手動觸發執行

jobs:
  update-weather:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Weather ETL Script
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
        run: |
          if [ -f "fetch_data.py" ]; then
            python fetch_data.py
          else
            echo "fetch_data.py not yet implemented. Skipping execution."
          fi
